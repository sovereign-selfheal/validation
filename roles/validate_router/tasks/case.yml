---
# One case: send the request, read its routing decision, record the result.
# Input: validate_router_case, validate_router_group.
- name: "Skip the case, it needs the classifier: {{ validate_router_case.id }}"
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _r:
      group: "{{ validate_router_group }}"
      id: "{{ validate_router_case.id }}"
      name: "{{ validate_router_case.name }}"
      status: SKIP
      detail: classifier.mode is off
  when:
    - "'classifier' in validate_router_case.requires | default([])"
    - validation_ctx.classifier_mode == 'off'

- name: "Run {{ validate_router_case.id }}"
  when: >-
    'classifier' not in validate_router_case.requires | default([])
    or validation_ctx.classifier_mode != 'off'
  vars:
    _expect: "{{ validate_router_case.expect }}"
    _want_status: "{{ _expect.status | default(200) | int }}"
    _key: >-
      {{ validate_router_case.key if validate_router_case.key is defined
         else validation_keys[validate_router_case.tier | default('research')] }}
  block:
    - name: "Note the start time of {{ validate_router_case.id }}"
      ansible.builtin.set_fact:
        validate_router_t0: "{{ now(utc=true, fmt='%s') }}"

    # no_log: the request headers hold the API key.
    - name: "Send {{ validate_router_case.id }}"
      ansible.builtin.uri:
        url: "{{ validation_ctx.url }}"
        method: POST
        headers: >-
          {{ {'Content-Type': 'application/json'}
             | combine({'Authorization': 'Bearer ' ~ _key} if _key | length > 0 else {})
             | combine(validate_router_case.headers | default({})) }}
        body_format: json
        body: >-
          {{ {'model': validate_router_model,
              'max_tokens': validate_router_case.max_tokens | default(validate_router_max_tokens) | int,
              'messages': [{'role': 'user', 'content': validate_router_case.prompt}]}
             | combine({'tools': validate_router_case.tools} if validate_router_case.tools is defined else {}) }}
        timeout: "{{ validate_router_timeout }}"
        validate_certs: "{{ validation_validate_certs }}"
        return_content: true
      register: validate_router_resp
      failed_when: false
      no_log: true

    - name: "Read the routing decision of {{ validate_router_case.id }}"
      policy_decisions:
        namespace: "{{ validation_router_namespace }}"
        label_selector: "{{ validate_router_litellm_selector }}"
        container: "{{ validate_router_litellm_container | default(omit, true) }}"
        since_seconds: "{{ (now(utc=true, fmt='%s') | int) - (validate_router_t0 | int) + 2 }}"
        exclude: "{{ validation_seen_decisions }}"
        timeout: "{{ validate_router_decision_timeout }}"
      register: validate_router_decision
      failed_when: false
      when: _want_status | int == 200

    - name: "Record {{ validate_router_case.id }}"
      ansible.builtin.set_fact:
        validation_seen_decisions: "{{ validation_seen_decisions + (_decisions | map(attribute='_key') | list) }}"
        validation_results: "{{ validation_results + [_r] }}"
      vars:
        _status: "{{ validate_router_resp.status | default(-1) | int }}"
        _decisions: "{{ validate_router_decision.decisions | default([]) }}"
        _d: "{{ validate_router_decision.decision | default({}) }}"
        _reason: "{{ _d.reason | default('') }}"
        _secs: "{{ '%.1f' | format(validate_router_resp.elapsed | default(0) | float) }}"
        _message: "{{ (validate_router_resp.json | default({})).choices | default([{}]) | first | default({}) }}"
        _content: "{{ (_message.message | default({})).content | default('', true) }}"
        _tool_calls: >-
          {{ (_message.message | default({})).tool_calls | default([], true)
             | map(attribute='function') | map(attribute='name') | list }}
        _route: >-
          {{ ('routed_to=' ~ _d.routed_to | default('-') ~ ' by=' ~ _d.decided_by | default('-')
              ~ ' team=' ~ _d.team | default('-') ~ ' | ' ~ _reason[:160]
              ~ (' | trace ' ~ _d.trace_id if _d.trace_id is defined else ''))
             if _d else 'no routing decision found in the LiteLLM logs' }}{{
             ' (' ~ _decisions | length ~ ' new decisions: other traffic?)' if _decisions | length > 1 else '' }}
        _error: >-
          {{ ' ' ~ validate_router_resp.msg | default('') if _status | int == -1 else '' }}{{
             ' | ' ~ validate_router_decision.msg if validate_router_decision.failed | default(false) else '' }}
        _checks:
          - "{{ _status == _want_status | int }}"
          - "{{ _expect.routed_to is undefined or _d.routed_to | default('') == _expect.routed_to }}"
          - "{{ _expect.decided_by is undefined or _d.decided_by | default('') == _expect.decided_by }}"
          - "{{ _expect.team is undefined or _d.team | default('') == _expect.team }}"
          - "{{ _expect.reason_contains | default([]) | reject('in', _reason) | list | length == 0 }}"
          - "{{ _expect.tool_call is undefined or _expect.tool_call in _tool_calls }}"
          - "{{ _expect.content_excludes | default([]) | select('in', _content) | list | length == 0 }}"
          - "{{ _want_status | int != 200 or _d | length > 0 }}"
          - "{{ not validate_router_decision.failed | default(false) }}"
        _r:
          group: "{{ validate_router_group }}"
          id: "{{ validate_router_case.id }}"
          name: "{{ validate_router_case.name }}"
          status: "{{ 'PASS' if _checks | reject | list | length == 0 else 'FAIL' }}"
          detail: >-
            HTTP {{ _status }} {{ _secs }}s{{ ' ' ~ _route if _want_status | int == 200 else '' }}{{
            ' | tool calls: ' ~ (_tool_calls | join(', ') or 'none') if _expect.tool_call is defined else '' }}{{ _error }}
