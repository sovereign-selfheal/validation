---
# Requests through the public router route; the decision of each request is read from the
# [policy-router] log lines of LiteLLM. Cases run one at a time.
- name: Start the router checks
  ansible.builtin.debug:
    msg: >-
      Router checks on {{ validation_ctx.url }} (SOTA {{ 'on' if validation_ctx.sota_enabled | bool else 'off: sota-smart
      is served by the local model' }}, classifier {{ validation_ctx.classifier_mode }},
      Presidio NER {{ 'on' if validation_ctx.ner_enabled | bool else 'off' }})
  tags: [access, routing, namespace, budget, demo]

# R0 sets validation_trace_match (strict or newest) for every group that reads a routing decision,
# including the harness (sota, context) and F2 (decision).
- name: Check that the router logs the trace id of a request
  ansible.builtin.include_tasks:
    file: trace_check.yml
    apply:
      tags: [access, routing, namespace, budget, demo, decision, sota, context]
  tags: [access, routing, namespace, budget, demo, decision, sota, context]

- name: Load the routing cases
  ansible.builtin.include_vars:
    file: "{{ validate_router_cases_file }}"
    name: validate_router_cases
  tags: [routing, namespace, budget, demo]

- name: Access cases
  ansible.builtin.include_tasks:
    file: case.yml
    apply:
      tags: [access]
  loop: "{{ validate_router_access_cases }}"
  loop_control:
    loop_var: validate_router_case
    label: "{{ validate_router_case.id }}"
  vars:
    validate_router_group: access
  tags: [access]

- name: Routing cases
  ansible.builtin.include_tasks:
    file: case.yml
    apply:
      tags: [routing]
  loop: "{{ validate_router_cases.routing_cases }}"
  loop_control:
    loop_var: validate_router_case
    label: "{{ validate_router_case.id }}"
  vars:
    validate_router_group: routing
  tags: [routing]

- name: Namespace policy cases (router v0.11.0; skipped when the policy is off)
  ansible.builtin.include_tasks:
    file: case.yml
    apply:
      tags: [namespace]
  loop: "{{ validate_router_cases.namespace_cases }}"
  loop_control:
    loop_var: validate_router_case
    label: "{{ validate_router_case.id }}"
  vars:
    validate_router_group: namespace
  tags: [namespace]

# N9: the knowledge of a public agent must not keep its requests LOCAL. The agent's knowledge and API
# key are read the way the triage-agent-operator resolves them: spec.knowledge.configMapName or the
# ConfigMap <name>-knowledge (key spec.knowledge.fileName, default knowledge.md), and
# spec.apiKey.existingSecret or the Secret <name>-apikey (key api_key).
- name: Read the public agents (N9)
  tags: [namespace]
  block:
    - name: Read the TriageAgent CRs
      kubernetes.core.k8s_info:
        api_version: "{{ validate_router_agent_api_version }}"
        kind: TriageAgent
      register: validate_router_agents
      failed_when: false

    - name: Read the public namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        label_selectors: ["{{ validate_router_data_class_label }}=public"]
      register: validate_router_public_ns

    - name: Keep the agents of the public namespaces
      ansible.builtin.set_fact:
        validate_router_public_agents: >-
          {{ validate_router_agents.resources | default([])
             | selectattr('metadata.namespace', 'in', validate_router_public_ns.resources | map(attribute='metadata.name') | list)
             | sort(attribute='metadata.namespace') | list }}

    - name: Skip N9, no public agent
      ansible.builtin.set_fact:
        validation_results: "{{ validation_results + [_r] }}"
      vars:
        _r:
          group: namespace
          id: N9
          name: "{{ (validate_router_cases.agent_cases | first).name }}"
          status: SKIP
          detail: >-
            no TriageAgent in a namespace labelled {{ validate_router_data_class_label }}=public{{
            ' (TriageAgent API not found: ' ~ validate_router_agents.msg | default('') ~ ')'
            if validate_router_agents.failed | default(false) else '' }}
      when: validate_router_public_agents | length == 0

    - name: Read the knowledge ConfigMap of each public agent
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: "{{ item.metadata.namespace }}"
        name: "{{ item.spec.knowledge.configMapName | default('', true) or item.metadata.name ~ '-knowledge' }}"
      loop: "{{ validate_router_public_agents }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      register: validate_router_agent_cms

    - name: Read the API key Secret of each public agent (not logged)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ item.metadata.namespace }}"
        name: "{{ item.spec.apiKey.existingSecret | default('', true) or item.metadata.name ~ '-apikey' }}"
      loop: "{{ validate_router_public_agents }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      register: validate_router_agent_secrets
      no_log: true

    # One case per agent: N9a, N9b, ... The knowledge and the key stay in two dicts by namespace,
    # out of the loop items.
    - name: Build the N9 cases (not logged)
      ansible.builtin.set_fact:
        validate_router_agent_knowledge: "{{ validate_router_agent_knowledge | default({}) | combine({_ns: _knowledge}) }}"
        validate_router_agent_keys: "{{ validate_router_agent_keys | default({}) | combine({_ns: _key}) }}"
        validate_router_agent_run: "{{ validate_router_agent_run | default([]) + [_case] }}"
      loop: "{{ validate_router_public_agents | zip(validate_router_agent_cms.results, validate_router_agent_secrets.results) | list }}"
      loop_control:
        index_var: validate_router_agent_index
        label: "{{ item.0.metadata.namespace }}/{{ item.0.metadata.name }}"
      vars:
        _agent: "{{ item.0 }}"
        _ns: "{{ _agent.metadata.namespace }}"
        _file: "{{ _agent.spec.knowledge.fileName | default('knowledge.md', true) }}"
        _knowledge: "{{ ((item.1.resources | default([]) | first | default({})).data | default({}))[_file] | default('') }}"
        _key: >-
          {{ ((item.2.resources | default([]) | first | default({})).data | default({})).api_key | default('') | b64decode }}
        _case: >-
          {{ validate_router_cases.agent_cases | first
             | combine({'id': (validate_router_cases.agent_cases | first).id ~ 'abcdefghijklmnopqrstuvwxyz'[validate_router_agent_index],
                        'name': (validate_router_cases.agent_cases | first).name ~ ' (' ~ _ns ~ '/' ~ _agent.metadata.name ~ ')',
                        'agent_namespace': _ns,
                        'agent_missing': ([] if _knowledge | length > 0 else ['knowledge ' ~ _file])
                                         + ([] if _key | length > 0 else ['API key'])}) }}
      no_log: true

- name: Public agent cases (N9)
  ansible.builtin.include_tasks:
    file: case.yml
    apply:
      tags: [namespace]
  loop: "{{ validate_router_agent_run | default([]) }}"
  loop_control:
    loop_var: validate_router_case
    label: "{{ validate_router_case.id }}"
  vars:
    validate_router_group: namespace
  tags: [namespace]

# Disruptive: uses up the SOTA budget of the tier validation for its window (5 minutes).
- name: SOTA budget cases (router v0.12.0; skipped when the budget is off)
  ansible.builtin.include_tasks:
    file: case.yml
    apply:
      tags: [budget]
  loop: "{{ validate_router_cases.budget_cases }}"
  loop_control:
    loop_var: validate_router_case
    label: "{{ validate_router_case.id }}"
  vars:
    validate_router_group: budget
  when: validation_disruptive | bool or 'budget' in ansible_run_tags
  tags: [budget]

- name: Demo cases
  ansible.builtin.include_tasks:
    file: case.yml
    apply:
      tags: [demo]
  loop: "{{ validate_router_cases.demo_cases }}"
  loop_control:
    loop_var: validate_router_case
    label: "{{ validate_router_case.id }}"
  vars:
    validate_router_group: demo
  tags: [demo]
