---
# Operators installed by the ansible repo (group_vars/all/main.yml there). `profile` limits an
# entry to the gpu profile, to observability_enabled or to team access (Group present).
validate_platform_operators:
  - {package: openshift-gitops-operator}
  - {package: openshift-cert-manager-operator}
  - {package: openshift-external-secrets-operator}
  - {package: openshift-custom-metrics-autoscaler-operator}   # KEDA, keda_enabled (default true)
  - {package: rhbk-operator, profile: team}
  - {package: rhcl-operator}
  - {package: authorino-operator}
  - {package: limitador-operator}
  - {package: dns-operator}
  - {package: rhods-operator}
  - {package: nfd, profile: gpu}
  - {package: gpu-operator-certified, profile: gpu}
  - {package: opentelemetry-product, profile: observability}
  - {package: tempo-product, profile: observability}
  - {package: cluster-observability-operator, profile: observability}

# Ingress (ansible repo, roles/ingress_gateway).
validate_platform_ingress_namespace: openshift-ingress
validate_platform_gateway_name: openshift-ai-inference
validate_platform_gateway_replicas: 2
validate_platform_route_name: maas-router
validate_platform_route_timeout: 10m
# AWS Classic load balancer idle timeout; the API may return 10m or 10m0s.
validate_platform_lb_idle_timeout_regex: "^10m(0s)?$"
# P18: Envoy container of the gateway pods, and the wait for a pod that has not tried the
# wasm download yet (retries x delay seconds).
validate_platform_gateway_proxy_container: istio-proxy
validate_platform_gateway_wasm_retries: 6
validate_platform_gateway_wasm_delay: 5
# P20: Kuadrant metrics (ansible repo: post-install of rhcl and roles/ingress_gateway).
validate_platform_kuadrant_namespace: kuadrant-system
validate_platform_limitador_podmonitor: limitador
validate_platform_authorino_servicemonitor: authorino
validate_platform_telemetry_policy: openshift-ai-inference-labels
# Created by spec.observability of the Kuadrant CR, which must stay off on RHCL 1.4.3
# (it scrapes port 15021 of the gateway pods and TargetDown fires).
validate_platform_broken_istio_podmonitor: istio-pod-monitor

# P21: user workload Prometheus (ansible repo, roles/user_workload_monitoring).
validate_platform_uwm_namespace: openshift-user-workload-monitoring
validate_platform_uwm_retention: 15d

# Workloads of the gitops repo that must run with high availability.
validate_platform_ha_deployments:
  - {name: litellm, selector: app=litellm}
  - {name: presidio-analyzer, selector: app=presidio-analyzer}
validate_platform_min_replicas: 2
validate_platform_pdbs: [litellm, presidio-analyzer]
validate_platform_authorino_min_replicas: 2

# InferenceService expected for each model profile (gitops localModel.profiles).
validate_platform_isvc_by_profile:
  gpu: qwen38-local
  cpu: qwen25-05b-local

# Decision model (gitops component decision-model, decisionModel.enabled): InferenceService,
# its hardware profile, the node label of its GPU pool, the port of the decision server.
validate_platform_decision_isvc: dgemma-decision
validate_platform_decision_hwprofile: dgemma-decision-gpu
validate_platform_decision_node_label: node-role.kubernetes.io/gpu-decision
validate_platform_decision_container: kserve-container
validate_platform_decision_port: 8080

# Secret store of ESO (ansible repo, roles/secrets_bootstrap).
validate_platform_secret_store: sovereign-selfheal

# Observability objects (gitops component observability, ansible UIPlugins).
validate_platform_tempo_name: tempo
validate_platform_collector_deployment: otel-collector
validate_platform_uiplugins: [distributed-tracing, monitoring]

# Team access (ansible repo, roles/team_access and roles/argocd_seed).
validate_platform_team_cluster_role: cluster-admin
validate_platform_argocd_name: openshift-gitops
