---
- name: Read the default IngressController
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: IngressController
    namespace: openshift-ingress-operator
    name: default
  register: validate_platform_ingresscontroller

# Long SOTA answers (up to ~3 minutes) need more than the 60 s default of the AWS Classic ELB.
- name: Record P7 (load balancer idle timeout)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _aws: >-
      {{ validate_platform_ingresscontroller.resources[0].spec.endpointPublishingStrategy.loadBalancer.providerParameters.aws
         | default({}) }}
    _timeout: "{{ _aws.classicLoadBalancer.connectionIdleTimeout | default('') }}"
    _r:
      group: platform
      id: P7
      name: ingress load balancer idle timeout 10m
      status: >-
        {{ 'SKIP' if _aws.type | default('') != 'Classic'
           else ('PASS' if _timeout is match(validate_platform_lb_idle_timeout_regex) else 'FAIL') }}
      detail: >-
        {{ 'no AWS Classic load balancer' if _aws.type | default('') != 'Classic'
           else 'connectionIdleTimeout: ' ~ (_timeout or 'default (60s)') }}

- name: Read the router Route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ validate_platform_ingress_namespace }}"
    name: "{{ validate_platform_route_name }}"
  register: validate_platform_route

- name: Record P8 (router Route)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _route: "{{ validate_platform_route.resources[0] | default({}) }}"
    _host: "{{ _route.spec.host | default('') }}"
    _timeout: "{{ _route.metadata.annotations['haproxy.router.openshift.io/timeout'] | default('') }}"
    _want_host: "{{ validation_router_host_prefix }}.{{ validation_ctx.domain }}"
    _r:
      group: platform
      id: P8
      name: Route {{ validate_platform_route_name }} (host, timeout {{ validate_platform_route_timeout }})
      status: "{{ 'PASS' if _host == _want_host and _timeout == validate_platform_route_timeout else 'FAIL' }}"
      detail: "{{ 'Route not found' if not _route else 'host ' ~ _host ~ ', timeout ' ~ (_timeout or 'default') }}"

- name: Read the inference Gateway
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "{{ validate_platform_ingress_namespace }}"
    name: "{{ validate_platform_gateway_name }}"
  register: validate_platform_gateway

- name: Read the HorizontalPodAutoscalers of the ingress namespace
  kubernetes.core.k8s_info:
    api_version: autoscaling/v2
    kind: HorizontalPodAutoscaler
    namespace: "{{ validate_platform_ingress_namespace }}"
  register: validate_platform_hpas

# The gateway HPA must not scale down during a demo: a scale-down cut long SOTA calls
# (fixed in the ansible repo with min = max = 2).
- name: Record P9 (inference Gateway)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _gw: "{{ validate_platform_gateway.resources[0] | default({}) }}"
    _programmed: "{{ _gw | condition_status('Programmed') }}"
    _hpa: >-
      {{ validate_platform_hpas.resources
         | selectattr('spec.scaleTargetRef.name', 'match', validate_platform_gateway_name) | first | default({}) }}
    _min: "{{ _hpa.spec.minReplicas | default(0) | int }}"
    _max: "{{ _hpa.spec.maxReplicas | default(0) | int }}"
    _fixed: "{{ _min | int == validate_platform_gateway_replicas | int and _max | int == validate_platform_gateway_replicas | int }}"
    _r:
      group: platform
      id: P9
      name: Gateway {{ validate_platform_gateway_name }} programmed, HPA fixed at {{ validate_platform_gateway_replicas }}
      status: >-
        {{ 'FAIL' if _programmed != 'True'
           else ('PASS' if _fixed | bool else ('WARN' if not _hpa else 'FAIL')) }}
      detail: >-
        Programmed={{ _programmed }},
        {{ 'HPA not found' if not _hpa else 'HPA ' ~ _hpa.metadata.name ~ ' min ' ~ _min ~ ' max ' ~ _max }}

- name: Read the inference gateway pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ validate_platform_ingress_namespace }}"
    label_selectors: ["gateway.networking.k8s.io/gateway-name={{ validate_platform_gateway_name }}"]
    field_selectors: [status.phase=Running]
  register: validate_platform_gateway_pods

# Each gateway Envoy downloads the Kuadrant wasm module, with no retry. A pod whose download
# failed answers 503 (wasm_fail_stream) to every request; the passthrough Route balances by
# source IP, so some clients always hit that pod. Healthy: successes >= 1 and failures 0 (same
# rule as roles/ingress_gateway/tasks/verify.yml in the ansible repo, which recreates such pods
# after the seed). A pod that just started may not have tried yet: short wait, then report.
- name: Read the wasm download stats of the gateway pods
  block:
    - name: Read the wasm download stats of each gateway pod
      kubernetes.core.k8s_exec:
        namespace: "{{ validate_platform_ingress_namespace }}"
        pod: "{{ _pod.metadata.name }}"
        container: "{{ validate_platform_gateway_proxy_container }}"
        command: pilot-agent request GET stats?filter=wasm.remote_load_fetch_
      loop: "{{ validate_platform_gateway_pods.resources | rejectattr('metadata.deletionTimestamp', 'defined') | list }}"
      loop_control:
        loop_var: _pod
        label: "{{ _pod.metadata.name }}"
      register: validate_platform_gateway_wasm
      changed_when: false
      failed_when: false
      until: >-
        (validate_platform_gateway_wasm.rc | default(1) | int != 0)
        or (validate_platform_gateway_wasm.stdout | default('')
            | regex_findall('remote_load_fetch_(?:successes|failures): ([0-9]+)') | map('int') | sum) > 0
      retries: "{{ validate_platform_gateway_wasm_retries }}"
      delay: "{{ validate_platform_gateway_wasm_delay }}"
  rescue:
    - name: Note the gateway pods that made no download attempt
      ansible.builtin.debug:
        msg: Some gateway pods made no wasm download attempt in time (P18 reports them).

- name: Record P18 (Kuadrant wasm module on every gateway pod)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _state: >-
      {%- set acc = namespace(items=[]) -%}
      {%- for r in validate_platform_gateway_wasm.results | default([]) -%}
      {%- set out = r.stdout | default('') -%}
      {%- set acc.items = acc.items + [{
            'pod': r._pod.metadata.name,
            'read': (r.rc | default(1) | int) == 0,
            'successes': out | regex_findall('remote_load_fetch_successes: ([0-9]+)') | map('int') | sum,
            'failures': out | regex_findall('remote_load_fetch_failures: ([0-9]+)') | map('int') | sum}] -%}
      {%- endfor -%}
      {{ acc.items }}
    _read: "{{ _state | selectattr('read') | list }}"
    _ok: "{{ _read | selectattr('successes', 'gt', 0) | selectattr('failures', 'eq', 0) | map(attribute='pod') | list }}"
    _failed: "{{ _read | selectattr('failures', 'gt', 0) | map(attribute='pod') | list }}"
    _untried: "{{ _read | selectattr('successes', 'eq', 0) | selectattr('failures', 'eq', 0) | map(attribute='pod') | list }}"
    _unreadable: "{{ _state | rejectattr('read') | map(attribute='pod') | list }}"
    _r:
      group: platform
      id: P18
      name: Kuadrant wasm module loaded on every gateway pod
      status: "{{ 'PASS' if _state | length > 0 and _ok | length == _state | length else 'FAIL' }}"
      detail: >-
        {{ 'no running gateway pod' if _state | length == 0
           else _ok | length ~ '/' ~ _state | length ~ ' pod(s) loaded it' }}{{
           '; failed download (answers 503 wasm_fail_stream, delete the pod): ' ~ (_failed | join(', '))
           if _failed | length > 0 else '' }}{{
           '; no download attempt: ' ~ (_untried | join(', ')) if _untried | length > 0 else '' }}{{
           '; stats not readable: ' ~ (_unreadable | join(', ')) if _unreadable | length > 0 else '' }}

- name: Read the Limitador PodMonitor
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: PodMonitor
    namespace: "{{ validate_platform_kuadrant_namespace }}"
    name: "{{ validate_platform_limitador_podmonitor }}"
  register: validate_platform_limitador_monitor

- name: Read the Authorino ServiceMonitor
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: ServiceMonitor
    namespace: "{{ validate_platform_kuadrant_namespace }}"
    name: "{{ validate_platform_authorino_servicemonitor }}"
  register: validate_platform_authorino_monitor

- name: Read the TelemetryPolicy of the Gateway
  kubernetes.core.k8s_info:
    api_version: extensions.kuadrant.io/v1alpha1
    kind: TelemetryPolicy
    namespace: "{{ validate_platform_ingress_namespace }}"
    name: "{{ validate_platform_telemetry_policy }}"
  register: validate_platform_telemetry

- name: Read the Istio PodMonitor of Kuadrant observability
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: PodMonitor
    namespace: "{{ validate_platform_ingress_namespace }}"
    name: "{{ validate_platform_broken_istio_podmonitor }}"
  register: validate_platform_istio_monitor

# Tokens per tier in Prometheus: Limitador and Authorino scraped by our monitors, label `tier`
# from the TelemetryPolicy. Kuadrant spec.observability must stay off on RHCL 1.4.3: its Istio
# PodMonitor scrapes port 15021 and TargetDown fires (ansible README, section Observability).
- name: Record P20 (Kuadrant metrics)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _limitador: "{{ validate_platform_limitador_monitor.resources | length }}"
    _authorino: "{{ validate_platform_authorino_monitor.resources | length }}"
    _policy: "{{ validate_platform_telemetry.resources[0] | default({}) }}"
    _enforced: "{{ _policy | condition_status('Enforced') }}"
    _istio: "{{ validate_platform_istio_monitor.resources | length }}"
    _r:
      group: platform
      id: P20
      name: Kuadrant metrics (Limitador, Authorino, tier label)
      status: >-
        {{ 'FAIL' if _limitador | int == 0 or _authorino | int == 0 or _enforced != 'True'
           else ('WARN' if _istio | int > 0 else 'PASS') }}
      detail: >-
        PodMonitor {{ validate_platform_limitador_podmonitor }} {{ 'present' if _limitador | int > 0 else 'missing' }},
        ServiceMonitor {{ validate_platform_authorino_servicemonitor }} {{ 'present' if _authorino | int > 0 else 'missing' }},
        TelemetryPolicy {{ validate_platform_telemetry_policy }}
        {{ 'missing' if not _policy else 'Enforced=' ~ _enforced }}{{
        '; ' ~ validate_platform_broken_istio_podmonitor ~ ' present: Kuadrant observability is on (TargetDown on RHCL 1.4.3)'
        if _istio | int > 0 else '' }}
