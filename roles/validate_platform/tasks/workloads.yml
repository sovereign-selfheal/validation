---
- name: Read the Argo CD Applications
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ validation_argocd_namespace }}"
  register: validate_platform_apps

- name: Record P10 (Argo CD Applications)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _apps: "{{ validate_platform_apps.resources }}"
    _bad: >-
      {{ _apps | rejectattr('status.sync.status', 'defined') | map(attribute='metadata.name') | list
         + _apps | selectattr('status.sync.status', 'defined')
           | rejectattr('status.sync.status', 'equalto', 'Synced') | map(attribute='metadata.name') | list
         + _apps | selectattr('status.health.status', 'defined')
           | rejectattr('status.health.status', 'equalto', 'Healthy') | map(attribute='metadata.name') | list }}
    _r:
      group: platform
      id: P10
      name: Argo CD Applications Synced and Healthy
      status: "{{ 'PASS' if _apps | length > 0 and _bad | length == 0 else 'FAIL' }}"
      detail: >-
        {{ _apps | length }} Applications{{ ', not Synced/Healthy: ' ~ (_bad | unique | join(', ')) if _bad else '' }}

- name: Read the pods of the HA deployments
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ validation_router_namespace }}"
    label_selectors: ["{{ item.selector }}"]
  loop: "{{ validate_platform_ha_deployments }}"
  loop_control:
    label: "{{ item.name }}"
  register: validate_platform_ha_pods

# Anti-affinity is "preferred": pods on the same node is a warning, not a failure.
- name: Record P11 (HA replicas)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _ready: "{{ item.resources | ready_pods }}"
    _ready_count: "{{ _ready | length }}"
    _nodes: "{{ _ready | map(attribute='spec.nodeName') | unique | list }}"
    _r:
      group: platform
      id: "P11-{{ item.item.name }}"
      name: "{{ item.item.name }}: at least {{ validate_platform_min_replicas }} Ready replicas on different nodes"
      status: >-
        {{ 'FAIL' if _ready_count | int < validate_platform_min_replicas | int
           else ('PASS' if _nodes | length >= validate_platform_min_replicas | int else 'WARN') }}
      detail: "{{ _ready_count }} Ready on {{ _nodes | length }} node(s)"
  loop: "{{ validate_platform_ha_pods.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read the PodDisruptionBudgets
  kubernetes.core.k8s_info:
    api_version: policy/v1
    kind: PodDisruptionBudget
    namespace: "{{ validation_router_namespace }}"
  register: validate_platform_pdbs_info

- name: Record P12 (PodDisruptionBudgets)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _missing: "{{ validate_platform_pdbs | difference(validate_platform_pdbs_info.resources | map(attribute='metadata.name')) }}"
    _r:
      group: platform
      id: P12
      name: PodDisruptionBudgets present
      status: "{{ 'PASS' if _missing | length == 0 else 'FAIL' }}"
      detail: "{{ 'present: ' ~ validate_platform_pdbs | join(', ') if not _missing else 'missing: ' ~ _missing | join(', ') }}"

- name: Read the Authorino instances
  kubernetes.core.k8s_info:
    api_version: operator.authorino.kuadrant.io/v1beta1
    kind: Authorino
  register: validate_platform_authorino

- name: Record P13 (Authorino replicas)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _replicas: "{{ validate_platform_authorino.resources | map(attribute='spec.replicas') | map('default', 1) | map('int') | list }}"
    _r:
      group: platform
      id: P13
      name: Authorino with at least {{ validate_platform_authorino_min_replicas }} replicas
      status: >-
        {{ 'PASS' if _replicas | length > 0 and _replicas | min >= validate_platform_authorino_min_replicas | int else 'FAIL' }}
      detail: "{{ 'no Authorino' if not _replicas else 'replicas: ' ~ _replicas | join(', ') }}"

- name: Read the InferenceServices
  kubernetes.core.k8s_info:
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
    namespace: "{{ validation_models_namespace }}"
  register: validate_platform_isvcs

- name: Record P14 (local model Ready)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _name: "{{ validate_platform_isvc_by_profile[validation_ctx.model_profile] | default('') }}"
    _isvc: "{{ validate_platform_isvcs.resources | selectattr('metadata.name', 'equalto', _name) | first | default({}) }}"
    _ready: "{{ _isvc | condition_status('Ready') }}"
    _r:
      group: platform
      id: P14
      name: InferenceService {{ _name }} Ready ({{ validation_ctx.model_profile }} profile)
      status: "{{ 'PASS' if _ready == 'True' else 'FAIL' }}"
      detail: "{{ 'not found' if not _isvc else 'Ready=' ~ _ready ~ ', URL ' ~ (_isvc.status.url | default('-')) }}"

# gitops chart local-model: HardwareProfile <isvc>-<profile> in the model namespace, linked by two annotations.
- name: Read the HardwareProfiles of the model namespace
  kubernetes.core.k8s_info:
    api_version: infrastructure.opendatahub.io/v1
    kind: HardwareProfile
    namespace: "{{ validation_models_namespace }}"
  register: validate_platform_hwprofiles

- name: Record P19 (local model hardware profile)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _isvc_name: "{{ validate_platform_isvc_by_profile[validation_ctx.model_profile] | default('') }}"
    _expected: "{{ _isvc_name ~ '-' ~ validation_ctx.model_profile }}"
    _isvc: "{{ validate_platform_isvcs.resources | selectattr('metadata.name', 'equalto', _isvc_name) | first | default({}) }}"
    _ann: "{{ _isvc.metadata.annotations | default({}) }}"
    _linked_name: "{{ _ann['opendatahub.io/hardware-profile-name'] | default('') }}"
    _linked_ns: "{{ _ann['opendatahub.io/hardware-profile-namespace'] | default('') }}"
    _profile: "{{ validate_platform_hwprofiles.resources | selectattr('metadata.name', 'equalto', _expected) | first | default({}) }}"
    _ids: "{{ _profile.spec.identifiers | default([]) | map(attribute='identifier') | list }}"
    _gpu_ok: "{{ validation_ctx.model_profile != 'gpu' or 'nvidia.com/gpu' in _ids }}"
    _ok: >-
      {{ _profile | length > 0 and _linked_name == _expected
         and _linked_ns == validation_models_namespace and _gpu_ok | bool }}
    _r:
      group: platform
      id: P19
      name: InferenceService {{ _isvc_name }} linked to hardware profile {{ _expected }}
      status: "{{ 'PASS' if _ok | bool else 'FAIL' }}"
      detail: >-
        profile {{ 'present' if _profile else 'missing' }}{{ ', identifiers: ' ~ _ids | join(', ') if _profile else '' }};
        ISVC annotation {{ (_linked_ns ~ '/' ~ _linked_name) if _linked_name else 'missing' }}

# gitops chart decision-model: the InferenceService is Ready, linked to its hardware profile, runs
# on the gpu-decision pool, and the decision server answers one yes/no question with a probability.
- name: Record P22 (decision model), skipped when it is off
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _r:
      group: platform
      id: P22
      name: Decision model {{ validate_platform_decision_isvc }} answers /v1/systemone
      status: SKIP
      detail: decisionModel.enabled is false
  when: not validation_ctx.decision_model_enabled | bool

- name: Check the decision model
  when: validation_ctx.decision_model_enabled | bool
  vars:
    _isvc: >-
      {{ validate_platform_isvcs.resources
         | selectattr('metadata.name', 'equalto', validate_platform_decision_isvc) | first | default({}) }}
  block:
    # ready_pods: Ready and not being deleted. After a node restart a failed pod of the old
    # ReplicaSet (UnexpectedAdmissionError, ContainerStatusUnknown) can stay next to the new one.
    - name: Read the decision model pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ validation_models_namespace }}"
        label_selectors:
          - "serving.kserve.io/inferenceservice={{ validate_platform_decision_isvc }}"
          - component=predictor
      register: validate_platform_decision_pods

    - name: Read the node of the decision model pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ _pod.spec.nodeName | default('none') }}"
      vars:
        _pod: "{{ validate_platform_decision_pods.resources | ready_pods | first | default({}) }}"
      register: validate_platform_decision_node

    # One question, a fixed text; the reply must hold a probability. Python: the image has no curl.
    - name: Ask the decision server one question
      kubernetes.core.k8s_exec:
        namespace: "{{ validation_models_namespace }}"
        pod: "{{ (validate_platform_decision_pods.resources | ready_pods | first).metadata.name }}"
        container: "{{ validate_platform_decision_container }}"
        command: >-
          python3 -c 'import json, time, urllib.request as u;
          body = {"model": "validation", "state": {"text": "The payment API returns HTTP 503 for every request."},
          "questions": {"outage": {"type": "noul", "instructions": "Is a service failing?"}}};
          t = time.time();
          r = u.urlopen(u.Request("http://127.0.0.1:{{ validate_platform_decision_port }}/v1/systemone",
          json.dumps(body).encode(), {"content-type": "application/json"}), timeout=60);
          p = json.load(r)["answers"]["outage"]["noul"];
          print(json.dumps({"p": p, "ms": round((time.time() - t) * 1000)}))'
      register: validate_platform_decision_answer
      changed_when: false
      failed_when: false
      when: validate_platform_decision_pods.resources | ready_pods | list | length > 0

    - name: Record P22 (decision model)
      ansible.builtin.set_fact:
        validation_results: "{{ validation_results + [_r] }}"
      vars:
        _ready: "{{ _isvc | condition_status('Ready') if _isvc else 'missing' }}"
        _ann: "{{ _isvc.metadata.annotations | default({}) }}"
        _linked: "{{ _ann['opendatahub.io/hardware-profile-name'] | default('') == validate_platform_decision_hwprofile }}"
        _node: "{{ validate_platform_decision_node.resources | first | default({}) }}"
        _on_pool: "{{ validate_platform_decision_node_label in (_node.metadata.labels | default({})) }}"
        _out: "{{ validate_platform_decision_answer.stdout | default('') | trim }}"
        _answer: "{{ _out | from_json if _out.startswith('{') else {} }}"
        _p_ok: "{{ _answer.p is defined and (_answer.p | float) >= 0 and (_answer.p | float) <= 1 }}"
        _ok: "{{ _ready == 'True' and _linked | bool and _on_pool | bool and _p_ok | bool }}"
        _r:
          group: platform
          id: P22
          name: Decision model {{ validate_platform_decision_isvc }} answers /v1/systemone
          status: "{{ 'PASS' if _ok | bool else 'FAIL' }}"
          detail: >-
            Ready={{ _ready }}; hardware profile {{ 'linked' if _linked | bool else 'not linked' }};
            node {{ _node.metadata.name | default('none') }}
            {{ '(' ~ validate_platform_decision_node_label ~ ')' if _on_pool | bool else '(not on the decision pool)' }};
            {{ 'p(outage)=' ~ ('%.3f' | format(_answer.p | float)) ~ ' in ' ~ _answer.ms ~ ' ms' if _p_ok | bool
               else 'no probability: ' ~ (_out or validate_platform_decision_answer.stderr | default('no pod'))[:200] }}

- name: Read the ExternalSecrets
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    namespace: "{{ validation_router_namespace }}"
  register: validate_platform_externalsecrets

- name: Read the ClusterSecretStore
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ClusterSecretStore
    name: "{{ validate_platform_secret_store }}"
  register: validate_platform_secretstore

- name: Record P15 (secrets)
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [_r] }}"
  vars:
    _es: "{{ validate_platform_externalsecrets.resources }}"
    _not_ready: "{{ _es | names_not_in_condition('Ready') }}"
    _store: "{{ validate_platform_secretstore.resources[0] | default({}) }}"
    _store_ready: "{{ _store | condition_status('Ready') }}"
    _store_ok: "{{ not validation_ctx.secret_store_enabled | bool or _store_ready == 'True' }}"
    _r:
      group: platform
      id: P15
      name: ExternalSecrets and ClusterSecretStore Ready
      status: "{{ 'PASS' if _es | length > 0 and _not_ready | length == 0 and _store_ok | bool else 'FAIL' }}"
      detail: >-
        {{ _es | length - _not_ready | length }}/{{ _es | length }} ExternalSecrets Ready{{
        ' (not Ready: ' ~ _not_ready | join(', ') ~ ')' if _not_ready else '' }},
        store {{ validate_platform_secret_store }}: {{ 'Ready=' ~ _store_ready
        if validation_ctx.secret_store_enabled | bool else 'not used (secretStore.enabled false)' }}
